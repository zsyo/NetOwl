name: Build

# 编译验证工作流:仅手动触发(workflow_dispatch),不随推送执行;
# 不打包不发布,Windows x64/arm64 编译 + clippy 零警告作为可发布把关标准

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64(与发布构建一致)
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # Windows arm64(原生 arm runner,与发布构建一致)
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # 输入名为 target(支持逗号分隔)
          target: ${{ matrix.target }}
          # 自动开启依赖缓存
          cache: true

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Clippy
        # 零警告把关:任何 warning 都视为失败
        run: cargo clippy --target ${{ matrix.target }} -- -D warnings
