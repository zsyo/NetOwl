name: Release

# 发布工作流:推送 v* tag 时构建 Windows x64/arm64 的 NSIS 安装器与便携 zip,
# 并创建 GitHub Release;也可手动触发仅构建与打包演练(不创建 Release)。
# 发布前 Cargo.toml 的 version 应与 tag 对齐(如 tag v0.1.0 ↔ version = "0.1.0");
# tag 版本号含 '-' 预发布段(如 v0.2.0-beta.1,SemVer)时 Release 标记为预发布。
# Release 更新说明:annotated tag 的 message 作为正文上半,其下叠加按提交记录
# 自动生成的变更列表(含 Full Changelog 跳转);轻量 tag 无 message 时仅自动生成。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    outputs:
      # 跨 job 传递预发布标志(release job 使用;矩阵各任务输出相同取其一)
      prerelease: ${{ steps.version.outputs.prerelease }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64:NSIS 安装器 + 便携 zip
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          # Windows arm64:NSIS 安装器 + 便携 zip(原生 arm runner)
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          # 输入名为 target(支持逗号分隔)
          target: ${{ matrix.target }}
          # 自动开启依赖缓存
          cache: true

      - name: Install Tools
        # 使用快速安装工具,避免从源码编译 cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" =~ refs/tags/v(.*) ]]; then
            version="${BASH_REMATCH[1]}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            # 预发布判定:tag 版本号含 '-' 预发布段即为预发布(SemVer
            # 标准,如 v0.2.0-beta.1)
            if [[ "$version" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # 全部资源(底图/GeoIP/图标字体/词条)编译期内嵌,词条同时以 locales
      # 目录外置随包分发;release 构建嵌入 UAC/DPI manifest(build.rs 按 PROFILE 判定)
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # NSIS 安装器走自定义模板 packaging/nsis/installer.nsi(含开机自启
      # 选项页,见模板头注释);产物默认名 netowl_{v}_{arch}-setup.exe
      - name: Package
        run: >
          cargo packager --release --formats nsis
          --target ${{ matrix.target }}

      - name: Create portable zip
        # 命名与本地 tools/package_release.ps1 对齐:netowl_{v}_windows_{arch}-portable.zip;
        # 装 exe + locales 词条目录:图标/底图编译期内嵌,词条外置便于用户增删语言
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $arch = "${{ matrix.arch }}"
          $portableDir = "netowl_${version}_windows_${arch}-portable"
          New-Item -ItemType Directory -Force -Path $portableDir

          $exe = "target/${{ matrix.target }}/release/netowl.exe"
          if (-not (Test-Path $exe)) {
              Write-Error "Required file $exe not found!"
              exit 1
          }
          Copy-Item -Path $exe -Destination "$portableDir/"

          # 词条外置:locales 整个目录进包,用户增删语言无需重新构建;
          # 缺失或为空直接失败,不静默产出一个没有词条的便携包
          $ftl = Get-ChildItem -Path "locales" -Filter "*.ftl" -File -ErrorAction SilentlyContinue
          if (-not $ftl) {
              Write-Error "No locales/*.ftl found!"
              exit 1
          }
          Copy-Item -Path "locales" -Destination "$portableDir/" -Recurse

          Compress-Archive -Path "$portableDir/*" -DestinationPath "$portableDir.zip"

      - name: Rename installers
        # 统一产物命名:版本号替换为 tag 版本(Cargo.toml 恒为干净版本,
        # 预发布身份仅体现在 tag),并在架构前补平台名:
        #   NSIS  netowl_{v}_{arch}-setup.exe -> netowl_{tv}_windows_{arch}-setup.exe
        shell: bash
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "Cargo.toml 版本: $cargo_version -> tag 版本: $TAG_VERSION"
          mkdir -p dist
          for f in target/${{ matrix.target }}/release/*-setup.exe; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            new="${base/$cargo_version/$TAG_VERSION}"
            new="${new/_x64-setup.exe/_windows_x64-setup.exe}"
            new="${new/_arm64-setup.exe/_windows_arm64-setup.exe}"
            cp "$f" "dist/$new"
          done
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-packages-${{ matrix.name }}
          path: |
            dist/*
            netowl_*-portable.zip

  # 独立发布 job:仅 tag 触发时执行,创建 GitHub Release 并挂全部产物
  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # 仅为读取 annotated tag 的 message 提供 git 仓库,tag 对象在下一步显式浅拉取
        uses: actions/checkout@v7

      - name: Read tag message
        id: tagmsg
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          git fetch --quiet --depth=1 origin "+refs/tags/${tag}:refs/tags/${tag}"
          # 只有 annotated tag 有 message;轻量 tag 直接指向 commit,
          # for-each-ref 的 %(contents) 会退化成该 commit 的提交说明,不能当发布说明用
          if [ "$(git cat-file -t "refs/tags/${tag}")" = "tag" ]; then
            msg=$(git for-each-ref --format='%(contents)' "refs/tags/${tag}")
          else
            msg=""
          fi
          if [ -n "${msg//[[:space:]]/}" ]; then
            printf '%s\n' "$msg" > release-notes.md
            echo "source=tag-message" >> "$GITHUB_OUTPUT"
          else
            echo "source=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-packages-*

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/release-packages-*/**
          draft: false
          # tag 版本号含 '-' 预发布段(如 v0.2.0-beta.1)时标记为预发布
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          # annotated tag 的 message 作为正文上半,下方叠加自动生成的变更列表
          # (含 Full Changelog 跳转);轻量 tag 无 message 时仅自动生成
          body_path: ${{ steps.tagmsg.outputs.source == 'tag-message' && 'release-notes.md' || '' }}
          generate_release_notes: true
