[package]
name = "netowl"
version = "0.1.0"
edition = "2024"

[build-dependencies]
# Windows exe 资源编译(图标/版本信息/manifest,见 build.rs)
winresource = "0.1"

# 发布优化:LTO + 单 codegen unit 收缩体积;strip 去符号;
# opt-level 保持默认 3,地图渲染与采集逻辑性能优先
[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
# egui/eframe: 即时模式自绘 GUI,painter 可直接绘制流量地图动画(选型理由见 AGENTS.md);
# glow 后端比默认 wgpu 编译更快、依赖更少,Windows 上足够
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "links"] }
fluent-bundle = "0.16"
# 仅用于解码内嵌的应用图标 PNG(assets 经 include_bytes! 编译期内嵌,发布产物不携带 assets);
# 选 png 而非 image:只为解码 RGBA PNG,image 即使关默认特性也拖带更多模块
png = "0.18.1"
# SQLite 持久化(连接历史/规则后续落盘);bundled 内置 SQLite 免系统依赖,
# Windows 上避免要求用户安装 sqlite3
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Windows API(真实连接采集:TCP/UDP 表快照、进程名查询;总速率采样:
# GetIfTable2/MIB_IF_ROW2 需 Ndis feature;签名校验 WinVerifyTrust 需
# WinTrust 与 Cryptography feature[WINTRUST_DATA 结构门控];进程图标提取
# 需 Shell/Gdi/WindowsAndMessaging feature;WFP 拦截引擎需
# WindowsFilteringPlatform 与 Security[TOKEN_ELEVATION/条件结构门控];
# ETW 流量事件采集需 Diagnostics_Etw feature;进程名兜底反查需
# Wdk_System_SystemInformation[NtQuerySystemInformation] 与
# WindowsProgramming[SYSTEM_PROCESS_INFORMATION])
# 注:tray-icon 0.26 起改用 windows-sys,依赖树中已无第二个 windows crate
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_WindowsProgramming",
    "Win32_System_Time",
    "Win32_System_Rpc",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Wdk_System_SystemInformation",
] }
# 配置持久化(serde + config.toml,参照 wallwarp 实际实现)
serde = { version = "1.0.229", features = ["derive"] }
# 规则导入导出的 JSON 序列化(serde 生态标准实现)
serde_json = "1.0.151"
# 规则导入导出的文件选择对话框(egui 生态标准方案,仅在此功能使用)
rfd = "0.17"
sys-locale = "0.3.2"
toml = "1.1.6"
# 托盘与原生菜单(muda 经 tray-icon re-export);default features 在 Windows 下无额外负担,
# 扩展 Linux 时需评估 default-features = false + 显式后端(AGENTS.md 扩展备忘)
tray-icon = "0.26.0"
unic-langid = "0.9"
# 日志(AGENTS.md 日志规范):RUST_LOG 控制应用自身档位,默认 info 且第三方库收敛 warn;
# env-filter 支持 RUST_LOG=netowl=debug 定向调试;appender 支撑文件日志开关
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# cargo-packager 打包配置(cargo packager --release):
# Windows 产出 NSIS 安装程序到 dist/;图标与底图数据已编译期内嵌,
# 发布产物不携带 assets,仅 locales 词条外置(运行时扫描 exe 同级
# locales/,目录缺失时使用编译期内嵌兜底,见 src/i18n)
[package.metadata.packager]
resources = ["locales"]
product_name = "NetOwl"
identifier = "com.zephyr.netowl"
# 合法值为 LSApplicationCategory 风格枚举(GraphicsAndDesign/Utilities 等,
# 无 Network),非法值直接反序列化报错
category = "Utilities"
icons = ["assets/app_icon.ico", "assets/app_icon.png"]
