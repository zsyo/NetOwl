[package]
name = "netowl"
version = "0.1.0"
edition = "2024"

[dependencies]
# egui/eframe: 即时模式自绘 GUI,painter 可直接绘制流量地图动画(选型理由见 AGENTS.md);
# glow 后端比默认 wgpu 编译更快、依赖更少,Windows 上足够
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "links"] }
fluent-bundle = "0.16"
# 仅用于解码内嵌的应用图标 PNG(assets 经 include_bytes! 编译期内嵌,发布产物不携带 assets);
# 选 png 而非 image:只为解码 RGBA PNG,image 即使关默认特性也拖带更多模块
png = "0.18.1"
# SQLite 持久化(连接历史/规则后续落盘);bundled 内置 SQLite 免系统依赖,
# Windows 上避免要求用户安装 sqlite3
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Windows API(真实连接采集:TCP/UDP 表快照、进程名查询;总速率采样:
# GetIfTable2/MIB_IF_ROW2 需 Ndis feature;签名校验 WinVerifyTrust 需
# WinTrust 与 Cryptography feature[WINTRUST_DATA 结构门控];进程图标提取
# 需 Shell/Gdi/WindowsAndMessaging feature;WFP 拦截引擎需
# WindowsFilteringPlatform 与 Security[TOKEN_ELEVATION/条件结构门控];
# ETW 流量事件采集需 Diagnostics_Etw feature);
# 版本与依赖树中 tray-icon 的 windows 0.62 保持一致,避免双份 windows crate
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_System_Rpc",
    "Win32_System_Time",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }
# 配置持久化(serde + config.toml,参照 wallwarp 实际实现)
serde = { version = "1.0.229", features = ["derive"] }
# 规则导入导出的 JSON 序列化(serde 生态标准实现)
serde_json = "1.0.145"
# 规则导入导出的文件选择对话框(egui 生态标准方案,仅在此功能使用)
rfd = "0.15"
sys-locale = "0.3.2"
toml = "1.1.6"
# 托盘与原生菜单(muda 经 tray-icon re-export);default features 在 Windows 下无额外负担,
# 扩展 Linux 时需评估 default-features = false + 显式后端(AGENTS.md 扩展备忘)
tray-icon = "0.25.1"
unic-langid = "0.9"
